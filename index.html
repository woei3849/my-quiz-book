<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>나의 문제집</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    background: #f5f6f8;
    color: #222;
}

header {
    background: white;
    padding: 22px 18px 14px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0 0 18px;
    font-size: 25px;
}

nav {
    display: flex;
    gap: 8px;
}

nav button {
    flex: 1;
    padding: 12px 5px;
    border: none;
    border-radius: 10px;
    background: #eeeeee;
    font-size: 16px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

h2 {
    margin-top: 5px;
}

.menu-button {
    width: 100%;
    text-align: left;
    padding: 17px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;
    font-size: 17px;
    font-weight: 600;
}

.back-button {
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 16px;
    color: #555;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow:
        0 2px 8px rgba(0,0,0,0.05);
}

.question-number {
    font-size: 14px;
    color: #777;
    margin-bottom: 12px;
}

.question-text {
    font-size: 19px;
    line-height: 1.7;
    font-weight: 600;
    margin-bottom: 18px;

    /* 문제 내용의 줄바꿈을 그대로 표시 */
    white-space: pre-line;
}

.choice {
    width: 100%;
    padding: 15px;
    margin-bottom: 9px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: white;
    color: #222;
    text-align: left;
    font-size: 16px;
    line-height: 1.5;
}

.choice.correct {
    background: #dbeafe;
    border-color: #3b82f6;
    color: #1d4ed8;
    font-weight: bold;
}

.choice.wrong {
    background: #fee2e2;
    border-color: #ef4444;
    color: #dc2626;
    font-weight: bold;
}

.choice:disabled {
    opacity: 1;
}

.answer-label {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #f1f5f9;
    line-height: 1.6;
}

.explanation {
    margin-top: 15px;
    padding: 16px;
    background: #fafafa;
    border-radius: 10px;
    line-height: 1.7;
    border-left: 4px solid #888;
    white-space: pre-line;
}

.subjective-answer {
    width: 100%;
    padding: 14px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 17px;
    margin-bottom: 10px;
    outline: none;
}

.subjective-answer:focus {
    border-color: #777;
}

.submit-button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.empty {
    text-align: center;
    color: #777;
    padding: 40px 10px;
}

</style>

</head>


<body>


<header>

<h1>📚 나의 문제집</h1>

<nav>

<button onclick="showHome('past')">
기출
</button>

<button onclick="showHome('theory')">
이론
</button>

<button onclick="showWrong()">
오답
</button>

</nav>

</header>


<main>


<section id="pastScreen"
         class="screen active">

<h2>기출</h2>

<div id="pastContent"></div>

</section>


<section id="theoryScreen"
         class="screen">

<h2>이론</h2>

<div id="theoryContent"></div>

</section>


<section id="wrongScreen"
         class="screen">

<h2>오답</h2>

<div id="wrongContent"></div>

</section>


</main>



<!-- 문제집 기능 -->

<script src="app.js"></script>


</body>

</html>
