<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>나의 문제집</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    background: #f5f6f8;
    color: #222;
}

header {
    background: white;
    padding: 22px 18px 14px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0 0 18px;
    font-size: 25px;
}

nav {
    display: flex;
    gap: 8px;
}

nav button {
    flex: 1;
    padding: 12px 5px;
    border: none;
    border-radius: 10px;
    background: #eeeeee;
    font-size: 16px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

h2 {
    margin-top: 5px;
}

.menu-button {
    width: 100%;
    text-align: left;
    padding: 17px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;
    font-size: 17px;
    font-weight: 600;
}

.back-button {
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 16px;
    color: #555;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow:
        0 2px 8px rgba(0,0,0,0.05);
}

.question-number {
    font-size: 14px;
    color: #777;
    margin-bottom: 12px;
}

.question-text {
    font-size: 19px;
    line-height: 1.6;
    font-weight: 600;
    margin-bottom: 18px;
}

.choice {
    width: 100%;
    padding: 15px;
    margin-bottom: 9px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: white;
    color: #222;
    text-align: left;
    font-size: 16px;
}

.choice.correct {
    background: #dbeafe;
    border-color: #3b82f6;
    color: #1d4ed8;
    font-weight: bold;
}

.choice.wrong {
    background: #fee2e2;
    border-color: #ef4444;
    color: #dc2626;
    font-weight: bold;
}

.choice:disabled {
    opacity: 1;
}

.answer-label {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #f1f5f9;
}

.explanation {
    margin-top: 15px;
    padding: 16px;
    background: #fafafa;
    border-radius: 10px;
    line-height: 1.6;
    border-left: 4px solid #888;
}

.empty {
    text-align: center;
    color: #777;
    padding: 40px 10px;
}
.question-text {
    white-space: pre-line;
}
      
</style>

</head>


<body>


<header>

<h1>📚 나의 문제집</h1>

<nav>

<button onclick="showHome('past')">
기출
</button>

<button onclick="showHome('theory')">
이론
</button>

<button onclick="showWrong()">
오답
</button>

</nav>

</header>


<main>


<section id="pastScreen"
         class="screen active">

<h2>기출</h2>

<div id="pastContent"></div>

</section>


<section id="theoryScreen"
         class="screen">

<h2>이론</h2>

<div id="theoryContent"></div>

</section>


<section id="wrongScreen"
         class="screen">

<h2>오답</h2>

<div id="wrongContent"></div>

</section>


</main>


<!-- ★ 문제 데이터 파일 -->

<script src="questions.js"></script>


<!-- ★ 문제집 기능 -->

<script>


let wrongAnswers =
    JSON.parse(
        localStorage.getItem("wrongAnswers")
    ) || [];


function hideScreens() {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

}


function showHome(type) {

    hideScreens();


    if (type === "past") {

        document
            .getElementById("pastScreen")
            .classList.add("active");

        showPastSubjects();

    }


    if (type === "theory") {

        document
            .getElementById("theoryScreen")
            .classList.add("active");

        showTheorySubjects();

    }

}



function showPastSubjects() {

    const subjects = [...new Set(

        questions

            .filter(q =>
                q.section === "기출"
            )

            .map(q =>
                q.subject
            )

    )];


    let html = "";


    subjects.forEach(subject => {

        html += `

        <button
            class="menu-button"

            onclick="showExamTypes('${subject}')">

            📖 ${subject}

        </button>

        `;

    });


    document
        .getElementById("pastContent")
        .innerHTML = html;

}



function showExamTypes(subject) {

    const examTypes = [...new Set(

        questions

            .filter(q =>
                q.section === "기출" &&
                q.subject === subject
            )

            .map(q =>
                q.examType
            )

    )];


    let html = `

        <button
            class="back-button"

            onclick="showPastSubjects()">

            ← 과목

        </button>

        <h2>${subject}</h2>

    `;


    examTypes.forEach(examType => {

        html += `

        <button
            class="menu-button"

            onclick="showYears(
                '${subject}',
                '${examType}'
            )">

            📝 ${examType}

        </button>

        `;

    });


    document
        .getElementById("pastContent")
        .innerHTML = html;

}



function showYears(
    subject,
    examType
) {

    const years = [...new Set(

        questions

            .filter(q =>
                q.section === "기출" &&
                q.subject === subject &&
                q.examType === examType
            )

            .map(q =>
                q.year
            )

    )];


    let html = `

        <button
            class="back-button"

            onclick="showExamTypes(
                '${subject}'
            )">

            ← 시험종류

        </button>

        <h2>
            ${subject} · ${examType}
        </h2>

    `;


    years.forEach(year => {

        html += `

        <button
            class="menu-button"

            onclick="showQuestions(
                '${subject}',
                '${examType}',
                '${year}'
            )">

            📅 ${year}년

        </button>

        `;

    });


    document
        .getElementById("pastContent")
        .innerHTML = html;

}



function showQuestions(
    subject,
    examType,
    year
) {

    const list = questions.filter(q =>

        q.section === "기출" &&

        q.subject === subject &&

        q.examType === examType &&

        q.year === year

    );


    let html = `

        <button
            class="back-button"

            onclick="showYears(
                '${subject}',
                '${examType}'
            )">

            ← 연도

        </button>

        <h2>
            ${year}년 ${examType}
        </h2>

    `;


    list.forEach(q => {

        html += `

        <button
            class="menu-button"

            onclick="openQuestion(${q.id})">

            ${q.number}

        </button>

        `;

    });


    document
        .getElementById("pastContent")
        .innerHTML = html;

}



function showTheorySubjects() {

    const subjects = [...new Set(

        questions

            .filter(q =>
                q.section === "이론"
            )

            .map(q =>
                q.subject
            )

    )];


    let html = "";


    subjects.forEach(subject => {

        html += `

        <button
            class="menu-button"

            onclick="showTheoryUnits(
                '${subject}'
            )">

            📖 ${subject}

        </button>

        `;

    });


    document
        .getElementById("theoryContent")
        .innerHTML = html;

}



function showTheoryUnits(subject) {

    const units = [...new Set(

        questions

            .filter(q =>
                q.section === "이론" &&
                q.subject === subject
            )

            .map(q =>
                q.unit
            )

            .filter(unit =>
                unit !== ""
            )

    )];


    let html = `

        <button
            class="back-button"

            onclick="showTheorySubjects()">

            ← 과목

        </button>

        <h2>${subject}</h2>

    `;


    units.forEach(unit => {

        html += `

        <button
            class="menu-button"

            onclick="showTheoryQuestions(
                '${subject}',
                '${unit}'
            )">

            📂 ${unit}

        </button>

        `;

    });


    document
        .getElementById("theoryContent")
        .innerHTML = html;

}



function showTheoryQuestions(
    subject,
    unit
) {

    const list = questions.filter(q =>

        q.section === "이론" &&

        q.subject === subject &&

        q.unit === unit

    );


    let html = `

        <button
            class="back-button"

            onclick="showTheoryUnits(
                '${subject}'
            )">

            ← 단원

        </button>

        <h2>${unit}</h2>

    `;


    list.forEach(q => {

        html += `

        <button
            class="menu-button"

            onclick="openQuestion(${q.id})">

            ${q.number}

        </button>

        `;

    });


    document
        .getElementById("theoryContent")
        .innerHTML = html;

}



function openQuestion(id) {

    const q =
        questions.find(
            question =>
                question.id === id
        );


    if (!q) return;


    let html = `

        <button
            class="back-button"

            onclick="goBackToList()">

            ← 문제 목록

        </button>


        <div class="card">

            <div class="question-number">
                ${q.number}
            </div>

            <div class="question-text">
                ${q.question}
            </div>

            <div id="choices">
    `;


    q.choices.forEach(
        (choice, index) => {

            html += `

                <button
                    class="choice"
                    id="choice-${index}"

                    onclick="answerQuestion(
                        ${q.id},
                        ${index}
                    )">

                    ${index + 1}. ${choice}

                </button>

            `;

        }
    );


    html += `

            </div>

            <div id="feedback"></div>

        </div>

    `;


    if (q.section === "기출") {

        document
            .getElementById("pastContent")
            .innerHTML = html;

    } else {

        document
            .getElementById("theoryContent")
            .innerHTML = html;

    }


    window.currentQuestion = q;

}



function answerQuestion(
    id,
    selectedIndex
) {

    const q =
        questions.find(
            question =>
                question.id === id
        );


    if (!q) return;


    document
        .querySelectorAll(
            "#choices .choice"
        )
        .forEach(button => {

            button.disabled = true;

        });


    const selected =
        document.getElementById(
            "choice-" +
            selectedIndex
        );


    const correct =
        document.getElementById(
            "choice-" +
            q.answer
        );


    if (selectedIndex === q.answer) {

        selected
            .classList
            .add("correct");

    } else {

        selected
            .classList
            .add("wrong");

        correct
            .classList
            .add("correct");

        saveWrong(q);

    }


    document
        .getElementById("feedback")
        .innerHTML = `

        <div class="answer-label">

            정답: ${q.answer + 1}번

        </div>

        <div class="explanation">

            <strong>해설</strong>

            <br><br>

            ${q.explanation}

        </div>

    `;

}



function saveWrong(q) {

    const exists =
        wrongAnswers.some(
            x => x.id === q.id
        );


    if (!exists) {

        wrongAnswers.push(q);

        localStorage.setItem(
            "wrongAnswers",
            JSON.stringify(
                wrongAnswers
            )
        );

    }

}



function showWrong() {

    hideScreens();

    document
        .getElementById("wrongScreen")
        .classList
        .add("active");

    showWrongSubjects();
}


// =========================
// 오답 - 과목
// =========================

function showWrongSubjects() {

    const subjects = [...new Set(

        wrongAnswers

            .map(q => q.subject)

    )];


    let html = `

        <h2>오답</h2>

    `;


    if (subjects.length === 0) {

        html += `

            <div class="empty">

                아직 틀린 문제가 없습니다.

            </div>

        `;

    } else {

        subjects.forEach(subject => {

            html += `

                <button

                    class="menu-button"

                    onclick="showWrongExamTypes(
                        '${subject}'
                    )">

                    📖 ${subject}

                </button>

            `;

        });

    }


    document
        .getElementById("wrongContent")
        .innerHTML = html;

}



// =========================
// 오답 - 국가직 / 지방직
// =========================

function showWrongExamTypes(subject) {

    const examTypes = [...new Set(

        wrongAnswers

            .filter(q =>
                q.subject === subject
            )

            .map(q =>
                q.examType
            )

            .filter(type =>
                type !== ""
            )

    )];


    let html = `

        <button

            class="back-button"

            onclick="showWrongSubjects()">

            ← 과목

        </button>

        <h2>${subject}</h2>

    `;


    examTypes.forEach(examType => {

        html += `

            <button

                class="menu-button"

                onclick="showWrongYears(
                    '${subject}',
                    '${examType}'
                )">

                📝 ${examType}

            </button>

        `;

    });


    document
        .getElementById("wrongContent")
        .innerHTML = html;

}



// =========================
// 오답 - 연도
// =========================

function showWrongYears(
    subject,
    examType
) {

    const years = [...new Set(

        wrongAnswers

            .filter(q =>
                q.subject === subject &&
                q.examType === examType
            )

            .map(q =>
                q.year
            )

            .filter(year =>
                year !== ""
            )

    )];


    let html = `

        <button

            class="back-button"

            onclick="showWrongExamTypes(
                '${subject}'
            )">

            ← 시험종류

        </button>

        <h2>
            ${subject} · ${examType}
        </h2>

    `;


    years.forEach(year => {

        html += `

            <button

                class="menu-button"

                onclick="showWrongQuestions(
                    '${subject}',
                    '${examType}',
                    '${year}'
                )">

                📅 ${year}년

            </button>

        `;

    });


    document
        .getElementById("wrongContent")
        .innerHTML = html;

}



// =========================
// 오답 - 문제 목록
// =========================

function showWrongQuestions(
    subject,
    examType,
    year
) {

    const list = wrongAnswers.filter(q =>

        q.subject === subject &&

        q.examType === examType &&

        q.year === year

    );


    let html = `

        <button

            class="back-button"

            onclick="showWrongYears(
                '${subject}',
                '${examType}'
            )">

            ← 연도

        </button>

        <h2>
            ${year}년 ${examType}
        </h2>

    `;


    list.forEach(q => {

        html += `

            <button

                class="menu-button"

                onclick="openWrongQuestion(
                    ${q.id}
                )">

                ${q.number}

            </button>

        `;

    });


    document
        .getElementById("wrongContent")
        .innerHTML = html;

}



// =========================
// 오답 문제 풀기
// =========================

function openWrongQuestion(id) {

    const q =
        wrongAnswers.find(
            question =>
                question.id === id
        );


    if (!q) return;


    let html = `

        <button

            class="back-button"

            onclick="showWrongQuestions(
                '${q.subject}',
                '${q.examType}',
                '${q.year}'
            )">

            ← 문제 목록

        </button>


        <div class="card">

            <div class="question-number">

                ${q.number}

            </div>


            <div class="question-text">

                ${q.question}

            </div>


            <div id="wrongChoices">

    `;


    q.choices.forEach(
        (choice, index) => {

            html += `

                <button

                    class="choice"

                    id="wrong-choice-${index}"

                    onclick="answerWrongQuestion(
                        ${q.id},
                        ${index}
                    )">

                    ${index + 1}. ${choice}

                </button>

            `;

        }
    );


    html += `

            </div>

            <div id="wrongFeedback"></div>

        </div>

    `;


    document
        .getElementById("wrongContent")
        .innerHTML = html;

}



// =========================
// 오답 문제 정답 확인
// =========================

function answerWrongQuestion(
    id,
    selectedIndex
) {

    const q =
        wrongAnswers.find(
            question =>
                question.id === id
        );


    if (!q) return;


    document

        .querySelectorAll(
            "#wrongChoices .choice"
        )

        .forEach(button => {

            button.disabled = true;

        });


    const selected =
        document.getElementById(
            "wrong-choice-" +
            selectedIndex
        );


    const correct =
        document.getElementById(
            "wrong-choice-" +
            q.answer
        );


    if (
        selectedIndex === q.answer
    ) {

        selected
            .classList
            .add("correct");

    } else {

        selected
            .classList
            .add("wrong");

        correct
            .classList
            .add("correct");

    }


    document
        .getElementById("wrongFeedback")
        .innerHTML = `

        <div class="answer-label">

            정답: ${q.answer + 1}번

        </div>


        <div class="explanation">

            <strong>해설</strong>

            <br><br>

            ${q.explanation}

        </div>

    `;

}


function goBackToList() {

    if (
        window.currentQuestion &&
        window.currentQuestion.section === "이론"
    ) {

        showTheoryUnits(
            window.currentQuestion.subject
        );

    } else if (
        window.currentQuestion
    ) {

        showQuestions(

            window.currentQuestion.subject,

            window.currentQuestion.examType,

            window.currentQuestion.year

        );

    }

}


showHome("past");

</script>

</body>

</html>
